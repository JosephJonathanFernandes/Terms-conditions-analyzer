[alembic]
# path to migration scripts
script_location = alembic

# timezone to use when rendering the date
# within the migration file as well as the filename.
# string value is passed to dateutil.tz.gettz()
# leave blank for localtime
timezone = utc

# the version locatoin to use as the base
# for down_revision in the first migration
# (default: None)
# base_version = None

# the version table name to use in the database
version_table = alembic_version

# the naming style to use when generating revision IDs
# values: 'hex', 'datetime'
# revision_environment = false

# the version of SQLAlchemy to use
sqlalchemy.url = driver://user:pass@localhost/dbname

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
